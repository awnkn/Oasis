# One-click deploy blueprint for Render (https://render.com).
# In the Render dashboard: New → Blueprint → select this repository.
services:
  - type: web
    name: oasis
    runtime: docker
    plan: starter # persistent disks require a paid instance (~$7/mo)
    healthCheckPath: /
    disk:
      name: oasis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false # manager password — Render prompts you for this on deploy
      - key: STAFF_PASSWORD
        sync: false # staff password (limited dashboard) — prompted on deploy
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/oasis.db
      - key: SITE_URL
        value: https://oasisjo.com # canonical URL for SEO, sitemap and links
